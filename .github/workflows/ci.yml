name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repo => GitHub-hosted runner minutes are free and unmetered.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Airflow (constrained)
        run: |
          uv venv --python 3.12
          uv pip install "apache-airflow==3.3.1" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"
          uv pip install "apache-airflow-providers-standard" pytest ruff
          if [ -s requirements.txt ]; then uv pip install -r requirements.txt; fi

      - name: Lint (Airflow 3 migration rules)
        run: uv run ruff check dags/ include/ tests/ --select E,F,AIR3

      - name: DAG integrity tests
        run: uv run pytest tests/ -v --tb=long

      # Surface the traceback as a check annotation AND in the run summary,
      # so the failure is readable without downloading the raw log archive.
      - name: Annotate failure
        if: failure()
        run: |
          OUT="$(uv run pytest tests/ --tb=short -q 2>&1 | tail -c 4000 || true)"
          {
            echo '## pytest failure'
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          OUT="${OUT//'%'/'%25'}"
          OUT="${OUT//$'\n'/'%0A'}"
          OUT="${OUT//$'\r'/'%0D'}"
          echo "::error title=pytest::${OUT}"
